version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Hadoop HDFS NameNode
  # ---------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=youtube-cluster
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ../data:/workspace/data
    networks:
      - bigdata-net

  # ---------------------------------------------------------------------------
  # Hadoop HDFS DataNode
  # ---------------------------------------------------------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    restart: always
    ports:
      - "9864:9864"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870"
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bigdata-net

  # ---------------------------------------------------------------------------
  # Apache Spark Master
  # ---------------------------------------------------------------------------
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    networks:
      - bigdata-net

  # ---------------------------------------------------------------------------
  # Apache Spark Worker
  # ---------------------------------------------------------------------------
  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    networks:
      - bigdata-net

  # ---------------------------------------------------------------------------
  # Interactive PySpark & JupyterLab Client
  # ---------------------------------------------------------------------------
  jupyter-spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: youtube-spark-client
    depends_on:
      - namenode
      - spark-master
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - USE_HDFS=true
      - HDFS_NAMENODE=hdfs://namenode:9000
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    networks:
      - bigdata-net

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  bigdata-net:
    driver: bridge

